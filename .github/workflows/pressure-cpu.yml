name: Pressure VTLA CPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-components:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pressure-cpu.txt
      - name: Install CPU component dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-pressure-cpu.txt
      - name: Verify CPU runtime
        run: |
          python -c "import torch; assert not torch.cuda.is_available(); print(torch.__version__)"
      - name: Test pressure components and prefix integration harness
        run: python -m pytest tests/vtla -q
